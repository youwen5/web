name: Pull latest photos

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update:
    name: Pull photos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Check for update and perform update
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          curl --fail --show-error --location "https://photos.youwen.dev/_system/manifest.json" --output root/photos/manifest.json

          git add -- root/photos/manifest.json
          if git diff --cached --quiet -- root/photos/manifest.json; then
            echo "Photo manifest is unchanged."
            exit 0
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          fi
          git commit -m "auto: update photos"
          git push
